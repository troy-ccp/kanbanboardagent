<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - Task Dashboard</title>
    <style>
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #262626;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border: #333333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 1rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border);
        }

        .header h1 { font-size: 1.5rem; }
        .header .last-updated { color: var(--text-secondary); font-size: 0.875rem; }

        .morning-summary {
            background: var(--bg-card);
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 8px;
            display: none;
        }

        .morning-summary.visible { display: block; }

        .summary-section {
            margin-bottom: 1rem;
        }

        .summary-section h3 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
        }

        .summary-item {
            padding: 0.5rem;
            background: var(--bg-secondary);
            margin-bottom: 0.25rem;
            border-radius: 4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .priority-icon { font-size: 1.25rem; }

        .board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem;
        }

        .column {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 0.75rem;
            min-height: 200px;
        }

        .column h3 {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.75rem;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .task-card {
            background: var(--bg-secondary);
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            border-radius: 6px;
            border-left: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }

        .task-card:hover { background: #333; }

        .task-card.high-priority { border-left-color: #ef4444; }
        .task-card.medium-priority { border-left-color: #f59e0b; }
        .task-card.low-priority { border-left-color: #10b981; }

        .task-card.blocked {
            border: 1px solid #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .task-title {
            font-weight: 500;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .task-description {
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .task-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .task-subtasks {
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .blocked-badge {
            display: inline-block;
            background: #ef4444;
            color: white;
            padding: 0.125rem 0.5rem;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-top: 0.25rem;
        }

        .empty-state {
            color: var(--text-secondary);
            text-align: center;
            padding: 2rem 0.5rem;
            font-size: 0.875rem;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        @media (max-width: 1400px) {
            .board { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .board { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎛️ Mission Control</h1>
        <div class="last-updated">Last updated: <span id="lastUpdated">Loading...</span></div>
    </div>

    <div class="morning-summary" id="morningSummary">
        <div class="summary-section">
            <h3>✅ Completed Overnight</h3>
            <div id="overnightCompleted"></div>
        </div>
        <div class="summary-section">
            <h3>🔶 Needs Your Input</h3>
            <div id="needsInput"></div>
        </div>
        <div class="summary-section">
            <h3>🔄 In Progress</h3>
            <div id="inProgress"></div>
        </div>
    </div>

    <div class="board">
        <div class="column" id="col-backlog">
            <h3>📥 Backlog</h3>
        </div>
        <div class="column" id="col-in_progress">
            <h3>🔄 In Progress</h3>
        </div>
        <div class="column" id="col-on_hold">
            <h3>⏸️ On Hold</h3>
        </div>
        <div class="column" id="col-review">
            <h3>👀 Review</h3>
        </div>
        <div class="column" id="col-done">
            <h3>✅ Done</h3>
        </div>
    </div>

    <script>
        // Load tasks on page load
        loadTasks();

        // Auto-refresh every 30 seconds
        setInterval(loadTasks, 30000);
    </script>
</body>
</html>
